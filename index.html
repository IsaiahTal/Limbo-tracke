<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Limbo Analytics Pro</title>

<style>
body {
  font-family: Arial;
  background: #0b1220;
  color: white;
  padding: 14px;
}

h2 { text-align: center; }

input {
  width: 100%;
  padding: 12px;
  margin: 6px 0;
  border-radius: 10px;
  border: none;
}

/* 🔥 HORIZONTAL SCROLL BAR */
.buttonBar {
  display: flex;
  overflow-x: auto;
  gap: 8px;
  padding: 10px 4px;
  white-space: nowrap;
}

.btnWrap {
  display: flex;
  align-items: center;
  gap: 6px;
  background: #111827;
  padding: 8px;
  border-radius: 10px;
  flex: 0 0 auto;
}

/* BUTTON */
button {
  padding: 10px 14px;
  border-radius: 10px;
  border: none;
  background: #1f2937;
  color: white;
  font-weight: bold;
  flex: 0 0 auto;
}

/* HEAT SQUARE */
.heat {
  width: 12px;
  height: 12px;
  border-radius: 3px;
}

.green { background: #22c55e; }
.yellow { background: #facc15; }
.red { background: #ef4444; }

#status {
  font-size: 12px;
  opacity: 0.8;
  margin-top: 6px;
}
</style>
</head>

<body>

<h2>🎯 Limbo Analytics Pro</h2>

<input id="roundInput" type="number" placeholder="Enter Round Number">

<div class="buttonBar" id="buttons"></div>

<button onclick="deleteLast()">🗑️ Delete Last</button>
<button onclick="manualSave()">💾 Save Progress</button>
<button onclick="resetAll()">🧨 Reset</button>

<div id="status"></div>

<h3 id="roundText">Round: 0</h3>

<div id="dashboard"></div>

<script>
let multipliers = [
200,300,400,500,600,700,800,900,1000,
1500,2000,3000,4000,5000
];

let entries = [];

const probabilityMap = {
  200: 200,
  300: 300,
  400: 400,
  500: 500,
  600: 600,
  700: 700,
  800: 800,
  900: 900,
  1000: 1000,
  1500: 1500,
  2000: 2000,
  3000: 3000,
  4000: 4000,
  5000: 5000
};

function save(){
  localStorage.setItem("limbo_v9", JSON.stringify(entries));
}

function load(){
  let data = localStorage.getItem("limbo_v9");
  if(data) entries = JSON.parse(data);
}

function manualSave(){
  save();
  showStatus("✔ Saved");
}

function showStatus(msg){
  document.getElementById("status").innerText = msg;
  setTimeout(()=>document.getElementById("status").innerText="",2000);
}

function addEntry(hitMulti){
  let r = parseInt(document.getElementById("roundInput").value);
  if(!r) return alert("Enter round number");

  entries.push({round:r, multi:hitMulti});
  save();
  render();
}

function deleteLast(){
  entries.pop();
  save();
  render();
}

function resetAll(){
  if(!confirm("Reset ALL data?")) return;
  entries = [];
  localStorage.removeItem("limbo_v9");
  render();
  showStatus("🧨 Reset done");
}

function buildStats(){
  let data = {};
  let current = 0;

  multipliers.forEach(m=>{
    data[m] = {hits:0,misses:0,last:0};
  });

  entries.forEach(e=>{
    current = e.round;

    multipliers.forEach(m=>{
      if(e.multi >= m){
        data[m].hits++;
        data[m].last = e.round;
      } else {
        data[m].misses++;
      }
    });
  });

  return {data,current};
}

function getHeat(hits, expected, current){
  let rate = hits ? current / hits : 0;

  if(rate < expected * 0.8) return "red";
  if(rate > expected * 1.2) return "yellow";
  return "green";
}

function render(){

  let {data, current} = buildStats();

  document.getElementById("roundText").innerText = "Round: " + current;

  let html = "";

  multipliers.forEach(m=>{
    let expected = probabilityMap[m];
    let color = getHeat(data[m].hits, expected, current);

    html += `
      <div class="btnWrap">

        <button onclick="addEntry(${m})">${m}x</button>

        <div class="heat ${color}"></div>

      </div>
    `;
  });

  document.getElementById("buttons").innerHTML = html;
}

load();
render();
</script>

</body>
</html>
