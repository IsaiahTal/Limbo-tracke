<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Limbo Analytics Pro</title>

<style>
body {
  font-family: Arial;
  background: #0b1220;
  color: white;
  padding: 14px;
}

h2 { text-align: center; }

input {
  width: 100%;
  padding: 12px;
  margin: 6px 0;
  border-radius: 10px;
  border: none;
}

button {
  padding: 10px;
  margin: 4px;
  border-radius: 10px;
  border: none;
  background: #1f2937;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  opacity: 0.8;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin-top: 10px;
}

.card {
  background: #111827;
  padding: 10px;
  border-radius: 10px;
  margin-top: 10px;
  transition: all 0.3s ease;
}

/* HEAT MAP COLORS - Based on variance percentage */
.heat-under-severe { 
  background: #7f1d1d; /* Dark Red - Very under expected variance */
  border-left: 4px solid #dc2626;
}

.heat-under-mild { 
  background: #3d1a1a; /* Red tint - Under expected variance */
  border-left: 4px solid #ef4444;
}

.heat-perfect { 
  background: #0a3d1a; /* Green - Within expected variance */
  border-left: 4px solid #22c55e;
}

.heat-above-mild { 
  background: #3d3d1a; /* Dark Yellow - Just above expected variance */
  border-left: 4px solid #eab308;
}

.heat-above-severe { 
  background: #4a3d0e; /* Bright Yellow - Very above expected variance */
  border-left: 4px solid #facc15;
}

.good { color: #22c55e; }
.bad { color: #ef4444; }
.warning { color: #eab308; }
.critical { color: #dc2626; }

.small {
  font-size: 12px;
  opacity: 0.8;
}

.stats-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 4px 0;
}

.round-counter {
  font-size: 24px;
  font-weight: bold;
  text-align: center;
  margin: 10px 0;
  padding: 10px;
  background: #111827;
  border-radius: 10px;
  border: 2px solid #1f2937;
}

.variance-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 12px;
  font-weight: bold;
  font-size: 12px;
  background: #1f2937;
}

.info-box {
  background: #111827;
  padding: 8px 12px;
  border-radius: 8px;
  margin: 5px 0;
  font-size: 13px;
  border-left: 3px solid #3b82f6;
}

.range-badge {
  background: #1e293b;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
}

.button-highlight {
  background: #3b82f6 !important;
}
</style>
</head>

<body>

<h2>🎯 Limbo Analytics Pro</h2>

<input id="roundInput" type="number" placeholder="Enter Round Number">

<div class="grid" id="buttons"></div>

<div style="margin-top:10px; display:flex; gap:6px;">
  <button onclick="deleteLast()" style="flex:1;">🗑️ Delete Last</button>
  <button onclick="clearAll()" style="flex:1; background:#4a0e0e;">🗑️ Clear All</button>
</div>

<div class="round-counter">
  📊 Current Round: <span id="roundText">0</span>
  <span style="font-size:14px; opacity:0.6; margin-left:10px;">
    (Entries: <span id="entryCount">0</span>)
  </span>
</div>

<div id="dashboard"></div>

<script>
let multipliers = [
200,300,400,500,600,700,800,900,1000,
1500,2000,3000,4000,5000
];

let entries = [];

const probabilityMap = {
  200: 200,
  300: 300,
  400: 400,
  500: 500,
  600: 600,
  700: 700,
  800: 800,
  900: 900,
  1000: 1000,
  1500: 1500,
  2000: 2000,
  3000: 3000,
  4000: 4000,
  5000: 5000
};

function save(){
  localStorage.setItem("limbo_v4", JSON.stringify(entries));
}

function load(){
  let data = localStorage.getItem("limbo_v4");
  if(data) entries = JSON.parse(data);
}

function addEntry(hitMulti){
  let r = parseInt(document.getElementById("roundInput").value);
  if(!r) return alert("Enter round number");
  if(r <= 0) return alert("Round must be greater than 0");
  
  // Check if we already have this round
  if(entries.some(e => e.round === r)) {
    return alert("Round " + r + " already exists! Delete it first or use a different round.");
  }

  entries.push({round:r, multi:hitMulti});
  // Sort entries by round number
  entries.sort((a,b) => a.round - b.round);
  save();
  render();
}

function deleteLast(){
  if(entries.length === 0) return alert("No entries to delete");
  entries.pop();
  save();
  render();
}

function clearAll(){
  if(entries.length === 0) return;
  if(confirm("Clear all entries?")){
    entries = [];
    save();
    render();
  }
}

function buildStats(){
  let data = {};
  let current = 0;

  multipliers.forEach(m=>{
    data[m] = {
      hits: 0,
      misses: 0,
      totalRounds: 0,
      lastHit: 0
    };
  });

  if(entries.length === 0) {
    return {data, current: 0};
  }

  // Get the last round
  current = entries[entries.length - 1].round;

  // Process each round from 1 to current
  let entryIndex = 0;
  
  for(let round = 1; round <= current; round++) {
    // Check if this round has a hit
    let hitMulti = null;
    if(entryIndex < entries.length && entries[entryIndex].round === round) {
      hitMulti = entries[entryIndex].multi;
      entryIndex++;
    }

    // Process all multipliers for this round
    multipliers.forEach(m => {
      data[m].totalRounds++;
      
      if(hitMulti !== null && hitMulti >= m) {
        // Hit for this multiplier
        data[m].hits++;
        data[m].lastHit = round;
      } else {
        // Miss for this multiplier
        data[m].misses++;
      }
    });
  }

  return {data, current};
}

function getHeatMapClass(variance, totalRounds) {
  if (variance === "-") return "heat-perfect";
  
  let v = parseFloat(variance);
  
  // Calculate variance as percentage of total rounds
  let variancePercent = totalRounds > 0 ? (v / totalRounds) * 100 : 0;
  
  // Use percentage-based thresholds
  if (variancePercent > 1) return "heat-under-severe";      // Dark Red - Very under expected
  if (variancePercent > 0.5) return "heat-under-mild";      // Red - Under expected
  if (variancePercent < -1) return "heat-above-severe";     // Bright Yellow - Very above expected
  if (variancePercent < -0.5) return "heat-above-mild";     // Dark Yellow - Just above expected
  return "heat-perfect";                                    // Green - Within expected variance
}

function render(){

  let {data, current} = buildStats();

  document.getElementById("roundText").innerText = current;
  document.getElementById("entryCount").innerText = entries.length;

  let html = "";

  // Show info about rounds
  if(entries.length > 0) {
    html += `
      <div class="info-box">
        📊 Total Rounds: <b>${current.toLocaleString()}</b> | 
        Entries: <b>${entries.length}</b> | 
        Range: <b>1 - ${current.toLocaleString()}</b>
        ${current > 0 ? `<span class="range-badge">All rounds automatically counted</span>` : ''}
      </div>
    `;
  }

  multipliers.forEach(m=>{
    let last = data[m].lastHit;
    let ago = last ? current - last : "-";

    let expected = probabilityMap[m];
    let total = data[m].totalRounds;
    
    // Calculate expected hits
    let expectedHits = total / expected;
    let actualHits = data[m].hits;
    
    // Calculate variance
    let variance = "-";
    let varianceDisplay = "-";
    if (total > 0) {
      let diff = actualHits - expectedHits;
      variance = diff;
      varianceDisplay = diff.toFixed(4);
    }
    
    // Calculate variance as percentage
    let variancePercent = total > 0 ? ((variance !== "-" ? parseFloat(variance) : 0) / total * 100) : 0;
    
    // Determine heat map color
    let heatClass = getHeatMapClass(variance, total);
    
    // Status label based on variance percentage
    let statusClass, statusLabel, statusIcon;
    if (total === 0) {
      statusClass = "good";
      statusLabel = "No data yet";
      statusIcon = "⚪";
    } else if (variancePercent > 1) {
      statusClass = "critical";
      statusLabel = "🔴 Very Under Expected";
      statusIcon = "🔴";
    } else if (variancePercent > 0.5) {
      statusClass = "bad";
      statusLabel = "🟠 Under Expected";
      statusIcon = "🟠";
    } else if (variancePercent < -1) {
      statusClass = "warning";
      statusLabel = "🟡 Very Above Expected";
      statusIcon = "🟡";
    } else if (variancePercent < -0.5) {
      statusClass = "warning";
      statusLabel = "🟨 Above Expected";
      statusIcon = "🟨";
    } else {
      statusClass = "good";
      statusLabel = "✅ Within Expected";
      statusIcon = "✅";
    }

    // Calculate percentages
    let hitPercentage = total > 0 ? (actualHits/total*100).toFixed(2) : 0;
    let expectedPercentage = (1/expected*100).toFixed(4);

    html += `
      <div class="card ${heatClass}">
        <div class="stats-row">
          <b style="font-size:18px;">${m}x</b>
          <span style="font-size:20px;">${statusIcon}</span>
        </div>
        
        <div class="stats-row">
          <span>Hits: <b>${actualHits}</b></span>
          <span>Misses: <b>${data[m].misses.toLocaleString()}</b></span>
          <span>Total: <b>${total.toLocaleString()}</b></span>
        </div>
        
        <div class="stats-row small">
          <span>Last hit: ${last || "-"}</span>
          <span>Rounds ago: ${ago}</span>
        </div>
        
        <div class="stats-row small">
          <span>Expected: <b>1/${expected}</b> (${expectedPercentage}%)</span>
          <span>Actual: <b>${actualHits}/${total.toLocaleString()}</b> (${hitPercentage}%)</span>
        </div>
        
        <div class="stats-row">
          <span class="${statusClass}">
            ${statusLabel}
          </span>
          ${variance !== "-" ? `<span class="variance-badge">Variance: ${varianceDisplay}</span>` : ''}
        </div>
        
        ${data[m].hits > 0 ? `<div class="small" style="margin-top:4px; opacity:0.6;">Hit rate: 1/${(total/actualHits).toFixed(0)}</div>` : ''}
      </div>
    `;
  });

  document.getElementById("dashboard").innerHTML = html;
}

function createButtons(){
  let html = "";
  multipliers.forEach(m=>{
    html += `<button onclick="addEntry(${m})">${m}x</button>`;
  });
  document.getElementById("buttons").innerHTML = html;
}

load();
createButtons();
render();
</script>

</body>
</html>
