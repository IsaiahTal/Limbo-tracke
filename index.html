<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics Pro</title>

<style>
body {
  font-family: Arial;
  background: #0b1220;
  color: white;
  padding: 14px;
}

h2 { text-align: center; }

input {
  width: 100%;
  padding: 12px;
  margin: 6px 0;
  border-radius: 10px;
  border: none;
  font-size: 16px;
}

button {
  padding: 8px;
  margin: 4px;
  border-radius: 10px;
  border: 2px solid #1f2937;
  color: white;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.3s ease;
  width: 100%;
  font-size: 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 130px;
  position: relative;
  overflow: hidden;
  transform-origin: center;
}

button:hover {
  opacity: 0.8;
  transform: scale(1.02);
}

button:active {
  transform: scale(0.85) !important;
  opacity: 0.6 !important;
}

.button-hit {
  animation: elastic-pop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}

@keyframes elastic-pop {
  0% { transform: scale(1); }
  20% { transform: scale(0.80); border-color: #22c55e; box-shadow: 0 0 40px rgba(34,197,94,0.5); }
  35% { transform: scale(1.15); }
  50% { transform: scale(0.90); }
  65% { transform: scale(1.05); }
  80% { transform: scale(0.95); }
  100% { transform: scale(1); }
}

.button-hit::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 0;
  height: 0;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.3);
  transform: translate(-50%, -50%);
  animation: ripple 0.7s ease-out forwards;
  pointer-events: none;
}

@keyframes ripple {
  0% { width: 0; height: 0; opacity: 0.8; }
  100% { width: 300px; height: 300px; opacity: 0; }
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin-top: 10px;
}

/* HEAT MAP COLORS FOR ENTIRE BUTTONS */
.btn-heat-perfect { 
  background: #0a3d1a !important;
  border-color: #22c55e !important;
}

.btn-heat-above-mild { 
  background: #3d3d1a !important;
  border-color: #eab308 !important;
}

.btn-heat-above-severe { 
  background: #4a3d0e !important;
  border-color: #facc15 !important;
}

.btn-heat-under-mild { 
  background: #3d1a1a !important;
  border-color: #ef4444 !important;
}

.btn-heat-under-severe { 
  background: #7f1d1d !important;
  border-color: #dc2626 !important;
}

/* CARDS - No heat map colors, just neutral */
.card {
  background: #111827;
  padding: 10px;
  border-radius: 10px;
  margin-top: 10px;
  border-left: 3px solid #1f2937;
}

.good { color: #22c55e; }
.bad { color: #ef4444; }
.warning { color: #eab308; }
.critical { color: #dc2626; }
.ahead { color: #22c55e; }
.behind { color: #ef4444; }

.small {
  font-size: 12px;
  opacity: 0.8;
}

.stats-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 4px 0;
}

.round-counter {
  font-size: 24px;
  font-weight: bold;
  text-align: center;
  margin: 10px 0;
  padding: 10px;
  background: #111827;
  border-radius: 10px;
  border: 2px solid #1f2937;
}

.variance-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 12px;
  font-weight: bold;
  font-size: 12px;
  background: #1f2937;
}

.ahead-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 12px;
  font-weight: bold;
  font-size: 12px;
  background: #0a3d1a;
  color: #22c55e;
}

.behind-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 12px;
  font-weight: bold;
  font-size: 12px;
  background: #3d1a1a;
  color: #ef4444;
}

.info-box {
  background: #111827;
  padding: 8px 12px;
  border-radius: 8px;
  margin: 5px 0;
  font-size: 13px;
  border-left: 3px solid #3b82f6;
}

.range-badge {
  background: #1e293b;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
}

.input-row {
  display: flex;
  gap: 10px;
  align-items: center;
  margin-bottom: 10px;
}

.input-row input {
  flex: 1;
}

.input-row button {
  flex: 0 0 auto;
  width: auto;
  padding: 12px 20px;
  background: #3b82f6;
  border-color: #3b82f6;
  min-height: auto;
  flex-direction: row;
}

.button-label {
  font-size: 16px;
  font-weight: bold;
}

.button-sub {
  font-size: 8px;
  opacity: 0.6;
  margin-top: 1px;
  text-align: center;
  line-height: 1.2;
}

/* BAR STYLES */
.bar-container {
  display: flex;
  gap: 2px;
  margin-top: 3px;
  width: 100%;
  justify-content: center;
  align-items: center;
}

.bar {
  width: 14px;
  height: 6px;
  border-radius: 2px;
  background: #1f2937;
  transition: all 0.3s ease;
}

.bar-percentage {
  font-size: 10px;
  opacity: 0.9;
  margin-top: 2px;
  font-weight: bold;
}

/* RED BARS - Low probability (1-50%) */
.bar-red-1 { background: #3a0a0a; }
.bar-red-2 { background: #5a0a0a; }
.bar-red-3 { background: #7a1a1a; }
.bar-red-4 { background: #9a2a2a; }
.bar-red-5 { background: #cc3a3a; }

/* GREEN/YELLOW BARS - High probability (51-99%) */
.bar-green-1 { background: #1a4a1a; }
.bar-green-2 { background: #1a6a1a; }
.bar-green-3 { background: #2a8a2a; }
.bar-green-4 { background: #6a8a1a; }
.bar-green-5 { background: #ccaa1a; }

/* EMPTY BARS */
.bar-empty { background: #1f2937; }

/* Percentage text colors */
.pct-low { color: #ef4444; }
.pct-medium { color: #eab308; }
.pct-high { color: #22c55e; }

.accuracy-badge {
  font-size: 8px;
  opacity: 0.5;
  margin-top: 1px;
}
</style>
</head>

<body>

<h2>🎯 Analytics Pro</h2>

<div class="input-row">
  <input id="roundInput" type="number" placeholder="Enter Round Number">
  <button onclick="addRoundOnly()">➕ Add Round</button>
</div>

<div class="grid" id="buttons"></div>

<div style="margin-top:10px; display:flex; gap:6px;">
  <button onclick="deleteLast()" style="flex:1; background:#1f2937; min-height:auto; flex-direction:row;">🗑️ Delete Last</button>
  <button onclick="clearAll()" style="flex:1; background:#4a0e0e; min-height:auto; flex-direction:row;">🗑️ Clear All</button>
</div>

<div class="round-counter">
  📊 Current Round: <span id="roundText">0</span>
  <span style="font-size:14px; opacity:0.6; margin-left:10px;">
    (Entries: <span id="entryCount">0</span>)
  </span>
</div>

<div id="dashboard"></div>

<script>
const TOTAL_ROUNDS = 500000;
let multipliers = [
200,300,400,500,600,700,800,900,1000,
1500,2000,3000,4000,5000,
10000,20000,30000,40000,50000,100000
];

let entries = [];
let predictionHistory = [];
let hitIntervals = {};

const probabilityMap = {
  200: 200,
  300: 300,
  400: 400,
  500: 500,
  600: 600,
  700: 700,
  800: 800,
  900: 900,
  1000: 1000,
  1500: 1500,
  2000: 2000,
  3000: 3000,
  4000: 4000,
  5000: 5000,
  10000: 10000,
  20000: 20000,
  30000: 30000,
  40000: 40000,
  50000: 50000,
  100000: 100000
};

function save(){
  localStorage.setItem("analytics_pro_v4", JSON.stringify(entries));
  localStorage.setItem("analytics_pro_predictions_v4", JSON.stringify(predictionHistory));
  localStorage.setItem("analytics_pro_intervals_v4", JSON.stringify(hitIntervals));
}

function load(){
  let data = localStorage.getItem("analytics_pro_v4");
  if(data) entries = JSON.parse(data);
  
  let predData = localStorage.getItem("analytics_pro_predictions_v4");
  if(predData) predictionHistory = JSON.parse(predData);
  
  let intervalData = localStorage.getItem("analytics_pro_intervals_v4");
  if(intervalData) hitIntervals = JSON.parse(intervalData);
}

function addRoundOnly(){
  let r = parseInt(document.getElementById("roundInput").value);
  if(!r) return alert("Enter round number");
  if(r <= 0) return alert("Round must be greater than 0");
  if(r > TOTAL_ROUNDS) return alert("Round cannot exceed " + TOTAL_ROUNDS);
  
  if(entries.some(e => e.round === r)) {
    return alert("Round " + r + " already exists! Delete it first or use a different round.");
  }

  entries.push({round:r, multi:null});
  entries.sort((a,b) => a.round - b.round);
  save();
  render();
  document.getElementById("roundInput").value = "";
  document.getElementById("roundInput").focus();
}

function addEntry(hitMulti){
  let r = parseInt(document.getElementById("roundInput").value);
  if(!r) return alert("Enter round number");
  if(r <= 0) return alert("Round must be greater than 0");
  if(r > TOTAL_ROUNDS) return alert("Round cannot exceed " + TOTAL_ROUNDS);
  
  if(entries.some(e => e.round === r)) {
    return alert("Round " + r + " already exists! Delete it first or use a different round.");
  }

  recordPredictions(r);
  
  entries.push({round:r, multi:hitMulti});
  entries.sort((a,b) => a.round - b.round);
  
  updateHitIntervals();
  
  save();
  render();
  document.getElementById("roundInput").value = "";
  document.getElementById("roundInput").focus();
  
  animateButton(hitMulti);
}

function recordPredictions(round){
  let {data, current} = buildStatsFromEntries(entries);
  
  multipliers.forEach(m => {
    let total = data[m].totalRounds;
    let actualHits = data[m].hits;
    let lastHit = data[m].lastHit;
    let hitRounds = data[m].hitRounds;
    
    let probability = calculateBaseProbability(total, actualHits, lastHit, current, m);
    
    predictionHistory.push({
      multiplier: m,
      round: round,
      prediction: probability,
      actualHit: false,
      checked: false
    });
  });
}

function updateHitIntervals(){
  hitIntervals = {};
  multipliers.forEach(m => {
    hitIntervals[m] = {
      hitRounds: [],
      gaps: [],
      avgGap: 0,
      minGap: Infinity,
      maxGap: 0,
      burstPatterns: [],
      catchupWindows: [],
      maxDryStreak: 0,
      currentDryStreak: 0
    };
  });
  
  if (entries.length === 0) return;
  
  let current = entries[entries.length - 1].round;
  let entryIndex = 0;
  
  for(let round = 1; round <= current; round++) {
    let hitMulti = null;
    if(entryIndex < entries.length && entries[entryIndex].round === round) {
      hitMulti = entries[entryIndex].multi;
      entryIndex++;
    }
    
    multipliers.forEach(m => {
      if(hitMulti !== null && hitMulti >= m) {
        hitIntervals[m].hitRounds.push(round);
      }
    });
  }
  
  multipliers.forEach(m => {
    let rounds = hitIntervals[m].hitRounds;
    if (rounds.length >= 2) {
      let gaps = [];
      let maxDry = 0;
      for (let i = 1; i < rounds.length; i++) {
        let gap = rounds[i] - rounds[i-1];
        gaps.push(gap);
        if (gap > maxDry) maxDry = gap;
      }
      hitIntervals[m].gaps = gaps;
      hitIntervals[m].avgGap = Math.round(gaps.reduce((a,b) => a + b, 0) / gaps.length);
      hitIntervals[m].minGap = Math.min(...gaps);
      hitIntervals[m].maxGap = Math.max(...gaps);
      hitIntervals[m].maxDryStreak = maxDry;
      
      let lastHit = rounds[rounds.length - 1];
      hitIntervals[m].currentDryStreak = current - lastHit;
      
      // Detect burst patterns
      let burstPatterns = [];
      let burstStart = 0;
      for (let i = 0; i < gaps.length; i++) {
        if (gaps[i] < hitIntervals[m].avgGap * 0.2) {
          if (burstStart === 0) burstStart = i;
        } else if (burstStart > 0) {
          burstPatterns.push({ start: burstStart, end: i - 1, count: i - burstStart });
          burstStart = 0;
        }
      }
      if (burstStart > 0) {
        burstPatterns.push({ start: burstStart, end: gaps.length - 1, count: gaps.length - burstStart });
      }
      hitIntervals[m].burstPatterns = burstPatterns;
      
      // Detect catch-up windows
      let longDroughts = [];
      for (let i = 0; i < gaps.length; i++) {
        if (gaps[i] > hitIntervals[m].avgGap * 2) {
          longDroughts.push({ index: i, gap: gaps[i] });
        }
      }
      hitIntervals[m].catchupWindows = longDroughts;
    } else if (rounds.length === 1) {
      let lastHit = rounds[0];
      hitIntervals[m].currentDryStreak = current - lastHit;
      hitIntervals[m].maxDryStreak = hitIntervals[m].currentDryStreak;
    }
  });
}

function updatePredictions(currentRound){
  predictionHistory.forEach(pred => {
    if (!pred.checked && pred.round <= currentRound) {
      let hitFound = false;
      
      for (let i = 0; i < entries.length; i++) {
        let entry = entries[i];
        if (entry.round >= pred.round && entry.round <= pred.round + 200) {
          if (entry.multi !== null && entry.multi >= pred.multiplier) {
            hitFound = true;
            break;
          }
        }
      }
      
      pred.actualHit = hitFound;
      pred.checked = true;
    }
  });
  
  if (predictionHistory.length > 5000) {
    predictionHistory = predictionHistory.slice(-5000);
  }
  
  save();
}

function getAccuracyModifier(multiplier) {
  let preds = predictionHistory.filter(p => p.multiplier === multiplier && p.checked);
  
  if (preds.length === 0) return { modifier: 1.0, count: 0, accuracy: 0 };
  
  let correct = 0;
  preds.forEach(pred => {
    let predictedHigh = pred.prediction >= 50;
    if (predictedHigh && pred.actualHit) correct++;
    else if (!predictedHigh && !pred.actualHit) correct++;
  });
  
  let accuracy = correct / preds.length;
  let modifier = 1 + (accuracy - 0.5) * 0.6;
  modifier = Math.max(0.6, Math.min(1.4, modifier));
  
  return { modifier: modifier, count: preds.length, accuracy: Math.round(accuracy * 100) };
}

function getCumulativePenalty(multiplier, currentPrediction) {
  let preds = predictionHistory.filter(p => p.multiplier === multiplier && p.checked);
  
  if (preds.length < 2) return { penalty: 0, streak: 0, streakType: '' };
  
  let recent = preds.slice(-15);
  
  let consecutiveMiss = 0;
  let consecutiveHit = 0;
  
  for (let i = recent.length - 1; i >= 0; i--) {
    let pred = recent[i];
    if (pred.prediction >= 70 && !pred.actualHit) {
      consecutiveMiss++;
    } else {
      break;
    }
  }
  
  for (let i = recent.length - 1; i >= 0; i--) {
    let pred = recent[i];
    if (pred.prediction <= 30 && pred.actualHit) {
      consecutiveHit++;
    } else {
      break;
    }
  }
  
  let penalty = 0;
  let streak = 0;
  let streakType = '';
  
  if (consecutiveMiss >= 2 && currentPrediction >= 70) {
    penalty = Math.min(0.5, consecutiveMiss * 0.08);
    streak = consecutiveMiss;
    streakType = 'miss';
  }
  
  if (consecutiveHit >= 2 && currentPrediction <= 30) {
    penalty = Math.min(0.5, consecutiveHit * 0.08);
    streak = consecutiveHit;
    streakType = 'hit';
  }
  
  let highMisses = preds.filter(p => p.prediction >= 70 && !p.actualHit).length;
  let lowHits = preds.filter(p => p.prediction <= 30 && p.actualHit).length;
  
  if (highMisses > 3 && currentPrediction >= 70) {
    let extraPenalty = Math.min(0.3, highMisses * 0.02);
    penalty = Math.max(penalty, extraPenalty);
  }
  
  if (lowHits > 3 && currentPrediction <= 30) {
    let extraBonus = Math.min(0.3, lowHits * 0.02);
    penalty = penalty - extraBonus;
  }
  
  penalty = Math.max(-0.4, Math.min(0.5, penalty));
  
  return { 
    penalty: penalty, 
    streak: streak,
    streakType: streakType
  };
}

function getCatchupBonus(multiplier, lastHit, current) {
  let interval = hitIntervals[multiplier];
  if (!interval || interval.hitRounds.length < 2) return { bonus: 0, inCatchup: false };
  
  let expectedRate = multiplier;
  let roundsSinceLastHit = lastHit ? current - lastHit : current;
  let maxDry = interval.maxDryStreak || 0;
  
  if (maxDry > 0 && roundsSinceLastHit > maxDry * 0.7) {
    let bonus = Math.min(50, ((roundsSinceLastHit / maxDry) * 30) + 10);
    return { bonus: Math.round(bonus), inCatchup: true };
  }
  
  if (maxDry > 0 && roundsSinceLastHit > maxDry) {
    let bonus = Math.min(60, 40 + ((roundsSinceLastHit - maxDry) / maxDry) * 20);
    return { bonus: Math.round(bonus), inCatchup: true };
  }
  
  if (roundsSinceLastHit > expectedRate * 2) {
    let bonus = Math.min(40, (roundsSinceLastHit / expectedRate) * 5);
    return { bonus: Math.round(bonus), inCatchup: true };
  }
  
  if (lastHit) {
    let sinceLastHit = current - lastHit;
    if (sinceLastHit < 50) {
      let hitRounds = interval.hitRounds;
      let hitIndex = hitRounds.indexOf(lastHit);
      if (hitIndex > 0) {
        let previousGap = hitRounds[hitIndex] - hitRounds[hitIndex - 1];
        if (previousGap > expectedRate * 2) {
          return { bonus: 20, inCatchup: true };
        }
      }
    }
  }
  
  return { bonus: 0, inCatchup: false };
}

function animateButton(multiplier){
  let buttons = document.querySelectorAll('.grid button');
  buttons.forEach(btn => {
    let label = btn.querySelector('.button-label');
    if (label) {
      let btnText = label.textContent;
      let btnMulti = parseInt(btnText.replace('k', '000').replace('x', ''));
      if (btnMulti === multiplier) {
        btn.classList.remove('button-hit');
        void btn.offsetWidth;
        btn.classList.add('button-hit');
        setTimeout(() => {
          btn.classList.remove('button-hit');
        }, 700);
      }
    }
  });
}

function deleteLast(){
  if(entries.length === 0) return alert("No entries to delete");
  entries.pop();
  updateHitIntervals();
  save();
  render();
}

function clearAll(){
  if(entries.length === 0) return;
  if(confirm("Clear all entries? (This will also clear prediction history and intervals)")){
    entries = [];
    predictionHistory = [];
    hitIntervals = {};
    save();
    render();
  }
}

function buildStatsFromEntries(entriesData){
  let data = {};
  let current = 0;

  multipliers.forEach(m=>{
    data[m] = {
      hits: 0,
      misses: 0,
      totalRounds: 0,
      lastHit: 0,
      hitRounds: []
    };
  });

  if(entriesData.length === 0) {
    return {data, current: 0};
  }

  current = entriesData[entriesData.length - 1].round;

  let entryIndex = 0;
  
  for(let round = 1; round <= current; round++) {
    let hitMulti = null;
    if(entryIndex < entriesData.length && entriesData[entryIndex].round === round) {
      hitMulti = entriesData[entryIndex].multi;
      entryIndex++;
    }

    multipliers.forEach(m => {
      data[m].totalRounds++;
      
      if(hitMulti !== null && hitMulti >= m) {
        data[m].hits++;
        data[m].lastHit = round;
        data[m].hitRounds.push(round);
      } else {
        data[m].misses++;
      }
    });
  }

  return {data, current};
}

function buildStats(){
  return buildStatsFromEntries(entries);
}

function getHitGaps(hitRounds) {
  if (hitRounds.length < 2) return { min: null, max: null, avg: null };
  
  let gaps = [];
  for (let i = 1; i < hitRounds.length; i++) {
    gaps.push(hitRounds[i] - hitRounds[i-1]);
  }
  
  return {
    min: Math.min(...gaps),
    max: Math.max(...gaps),
    avg: Math.round(gaps.reduce((a,b) => a + b, 0) / gaps.length)
  };
}

function getHeatMapType(totalRounds, actualHits, multiplier) {
  if (totalRounds === 0) return "perfect";
  
  if (actualHits === 0) {
    let expectedHits = totalRounds / multiplier;
    if (expectedHits < 0.5) return "perfect";
    if (expectedHits < 2) return "under-mild";
    return "under-severe";
  }
  
  let actualRoundsPerHit = totalRounds / actualHits;
  let expectedRoundsPerHit = multiplier;
  let ratio = actualRoundsPerHit / expectedRoundsPerHit;
  
  if (ratio > 5.0) return "under-severe";
  if (ratio > 2.0) return "under-mild";
  if (ratio < 0.5) return "above-severe";
  if (ratio < 2.0) return "above-mild";
  return "perfect";
}

function getButtonClass(heatType) {
  switch(heatType) {
    case 'perfect': return 'btn-heat-perfect';
    case 'above-mild': return 'btn-heat-above-mild';
    case 'above-severe': return 'btn-heat-above-severe';
    case 'under-mild': return 'btn-heat-under-mild';
    case 'under-severe': return 'btn-heat-under-severe';
    default: return '';
  }
}

function calculateBaseProbability(totalRounds, actualHits, lastHit, current, multiplier) {
  let expectedHits = totalRounds / multiplier;
  let actualRate = actualHits > 0 ? totalRounds / actualHits : Infinity;
  let expectedRate = multiplier;
  let roundsSinceLastHit = lastHit ? current - lastHit : current;
  let aheadBehind = actualHits - expectedHits;
  
  let baseProb = roundsSinceLastHit / expectedRate;
  
  let modifier = 1;
  if (aheadBehind > 0) {
    modifier = 1 / (1 + aheadBehind * 0.15);
  } else if (aheadBehind < 0) {
    modifier = 1 + (Math.abs(aheadBehind) * 0.2);
  }
  
  let actualRateImpact = 1;
  if (actualHits > 0) {
    let rateRatio = actualRate / expectedRate;
    if (rateRatio < 1) {
      actualRateImpact = Math.min(2.0, 1 / rateRatio);
    } else {
      actualRateImpact = Math.max(0.5, 1 / rateRatio);
    }
  }
  
  let finalProb = baseProb * modifier * actualRateImpact;
  
  // Remaining hits tracking (silent)
  let totalPossible = TOTAL_ROUNDS / multiplier;
  let remainingHits = totalPossible - actualHits;
  let roundsRemaining = TOTAL_ROUNDS - current;
  let expectedRemaining = roundsRemaining / multiplier;
  
  if (remainingHits > 0 && expectedRemaining > 0) {
    let remainingRatio = remainingHits / expectedRemaining;
    if (remainingRatio < 0.8) {
      finalProb = finalProb * (1 + (1 - remainingRatio) * 0.2);
    }
  }
  
  // Use interval patterns if available
  let interval = hitIntervals[multiplier];
  if (interval && interval.hitRounds.length >= 2) {
    let avgGap = interval.avgGap;
    let maxDry = interval.maxDryStreak || 0;
    let currentDry = interval.currentDryStreak || 0;
    
    if (avgGap > 0 && roundsSinceLastHit > 0) {
      let intervalRatio = roundsSinceLastHit / avgGap;
      if (intervalRatio > 0) {
        let intervalProb = Math.min(1, intervalRatio);
        finalProb = (finalProb + intervalProb) / 2;
      }
    }
    
    if (maxDry > 0 && currentDry > maxDry * 0.7) {
      let dryBoost = 1 + ((currentDry / maxDry) * 0.3);
      finalProb = finalProb * dryBoost;
    }
    
    if (interval.burstPatterns && interval.burstPatterns.length > 0) {
      let recentHits = interval.hitRounds.slice(-5);
      if (recentHits.length >= 2) {
        let recentGaps = [];
        for (let i = 1; i < recentHits.length; i++) {
          recentGaps.push(recentHits[i] - recentHits[i-1]);
        }
        let avgRecentGap = recentGaps.reduce((a,b) => a + b, 0) / recentGaps.length;
        if (avgRecentGap < interval.avgGap * 0.3) {
          finalProb = finalProb * 1.3;
        }
      }
    }
  }
  
  finalProb = Math.min(99, Math.round(finalProb * 100));
  if (totalRounds > 0 && finalProb < 1) finalProb = 1;
  
  return finalProb;
}

function calculateFinalProbability(totalRounds, actualHits, lastHit, current, multiplier) {
  let baseProb = calculateBaseProbability(totalRounds, actualHits, lastHit, current, multiplier);
  
  let accResult = getAccuracyModifier(multiplier);
  let accuracyModifier = accResult.modifier;
  
  let penaltyResult = getCumulativePenalty(multiplier, baseProb);
  let penalty = penaltyResult.penalty;
  
  let catchupResult = getCatchupBonus(multiplier, lastHit, current);
  let catchupBonus = catchupResult.bonus / 100;
  let inCatchup = catchupResult.inCatchup;
  
  let finalProb = baseProb * accuracyModifier * (1 - penalty);
  
  if (inCatchup) {
    finalProb = finalProb * (1 + catchupBonus);
  }
  
  let interval = hitIntervals[multiplier];
  if (interval && interval.burstPatterns && interval.burstPatterns.length > 0) {
    let hitRounds = interval.hitRounds;
    if (hitRounds.length >= 3) {
      let lastThree = hitRounds.slice(-3);
      let gaps = [];
      for (let i = 1; i < lastThree.length; i++) {
        gaps.push(lastThree[i] - lastThree[i-1]);
      }
      if (gaps.length === 2 && gaps[0] < interval.avgGap * 0.2 && gaps[1] < interval.avgGap * 0.2) {
        finalProb = finalProb * 1.2;
      }
    }
  }
  
  finalProb = Math.min(99, Math.round(finalProb));
  if (totalRounds > 0 && finalProb < 1) finalProb = 1;
  
  return {
    probability: finalProb,
    baseProb: baseProb,
    accuracyModifier: accuracyModifier,
    penalty: penalty,
    streak: penaltyResult.streak,
    streakType: penaltyResult.streakType,
    accCount: accResult.count,
    accAccuracy: accResult.accuracy || 0,
    inCatchup: inCatchup,
    catchupBonus: Math.round(catchupBonus * 100)
  };
}

function getBarsAndColor(percentage) {
  let bars = Math.min(5, Math.floor(percentage / 20) + 1);
  let barClass = '';
  let pctClass = '';
  
  if (percentage <= 50) {
    barClass = 'bar-red-';
    pctClass = 'pct-low';
  } else {
    barClass = 'bar-green-';
    if (percentage <= 70) {
      pctClass = 'pct-medium';
    } else {
      pctClass = 'pct-high';
    }
  }
  
  return { bars, barClass, pctClass };
}

function render(){

  if (entries.length > 0) {
    let current = entries[entries.length - 1].round;
    updatePredictions(current);
  }
  
  updateHitIntervals();
  
  let {data, current} = buildStats();

  document.getElementById("roundText").innerText = current;
  document.getElementById("entryCount").innerText = entries.length;

  let buttonHtml = "";
  multipliers.forEach(m=>{
    let total = data[m].totalRounds;
    let actualHits = data[m].hits;
    let lastHit = data[m].lastHit;
    let hitRounds = data[m].hitRounds;
    let heatType = getHeatMapType(total, actualHits, m);
    let btnClass = getButtonClass(heatType);
    
    let label = m >= 10000 ? (m/1000) + 'k' : m + 'x';
    if (m === 100000) label = '100k';
    
    let probResult = calculateFinalProbability(total, actualHits, lastHit, current, m);
    let probability = probResult.probability;
    
    let barResult = getBarsAndColor(probability);
    let bars = barResult.bars;
    let barClass = barResult.barClass;
    let pctClass = barResult.pctClass;
    
    let barHtml = '';
    for (let i = 0; i < 5; i++) {
      let filled = i < bars ? barClass + (i + 1) : 'bar-empty';
      barHtml += `<div class="bar ${filled}"></div>`;
    }
    
    let likelihood = '';
    if (probability <= 10) likelihood = 'Very Unlikely';
    else if (probability <= 25) likelihood = 'Unlikely';
    else if (probability <= 45) likelihood = 'Possible';
    else if (probability <= 55) likelihood = '50/50';
    else if (probability <= 70) likelihood = 'Likely';
    else if (probability <= 85) likelihood = 'Very Likely';
    else likelihood = 'Almost Certain';
    
    let accText = '';
    if (probResult.accCount >= 3) {
      accText = `📊 ${probResult.accAccuracy}% acc (${probResult.accCount})`;
    } else if (probResult.accCount > 0) {
      accText = `🧠 Learning... (${probResult.accCount})`;
    }
    
    let streakText = '';
    if (probResult.streak >= 2) {
      if (probResult.streakType === 'miss') {
        streakText = `🔥 Miss: ${probResult.streak}`;
      } else if (probResult.streakType === 'hit') {
        streakText = `✅ Hit: ${probResult.streak}`;
      }
    }
    
    let catchupText = '';
    if (probResult.inCatchup) {
      catchupText = `📈 Catch-up +${probResult.catchupBonus}%`;
    }
    
    // Show dry streak info
    let interval = hitIntervals[m];
    let dryText = '';
    if (interval && interval.currentDryStreak !== undefined && interval.currentDryStreak > 0) {
      dryText = `🔥 Dry: ${interval.currentDryStreak}`;
      if (interval.maxDryStreak > 0) {
        dryText += ` | Max: ${interval.maxDryStreak}`;
      }
    }
    
    buttonHtml += `
      <button class="${btnClass}" onclick="addEntry(${m})" data-multiplier="${m}">
        <span class="button-label">${label}</span>
        <div class="bar-container">
          ${barHtml}
        </div>
        <span class="bar-percentage ${pctClass}">${probability}%</span>
        <span class="button-sub">${likelihood} in next 200 rounds</span>
        <span class="button-sub">${dryText}</span>
        <span class="accuracy-badge">${accText} ${streakText} ${catchupText}</span>
      </button>
    `;
  });
  document.getElementById("buttons").innerHTML = buttonHtml;

  // Render dashboard cards
  let html = "";

  if(entries.length > 0) {
    html += `
      <div class="info-box">
        📊 Total Rounds: <b>${current.toLocaleString()}</b> | 
        Entries: <b>${entries.length}</b> | 
        Range: <b>1 - ${current.toLocaleString()}</b>
        ${current > 0 ? `<span class="range-badge">All rounds automatically counted</span>` : ''}
        ${predictionHistory.filter(p => p.checked).length > 0 ? 
          `<span class="range-badge">🧠 ${predictionHistory.filter(p => p.checked).length} predictions learned</span>` : ''}
        <span class="range-badge">🎯 ${Math.round((current/TOTAL_ROUNDS)*100)}% of 500k rounds</span>
        <span class="range-badge">📊 ${Object.keys(hitIntervals).filter(m => hitIntervals[m].hitRounds.length >= 2).length} multipliers with interval data</span>
      </div>
    `;
  }

  multipliers.forEach(m=>{
    let last = data[m].lastHit;
    let ago = last ? current - last : "-";

    let expected = probabilityMap[m];
    let total = data[m].totalRounds;
    let actualHits = data[m].hits;
    let hitRounds = data[m].hitRounds;
    
    let expectedHits = total / expected;
    let variance = total > 0 ? actualHits - expectedHits : "-";
    let varianceDisplay = variance !== "-" ? variance.toFixed(4) : "-";
    
    let actualRoundsPerHit = actualHits > 0 ? (total / actualHits).toFixed(0) : "∞";
    let ratio = actualHits > 0 ? (total / actualHits) / expected : Infinity;
    
    let aheadBehind = actualHits - expectedHits;
    let aheadBehindDisplay = aheadBehind.toFixed(2);
    let aheadBehindClass = aheadBehind >= 0 ? "ahead" : "behind";
    let aheadBehindLabel = aheadBehind >= 0 ? "Ahead" : "Behind";
    let aheadBehindIcon = aheadBehind >= 0 ? "✅" : "🔴";
    
    let totalPossible = Math.round(TOTAL_ROUNDS / m);
    let remainingHits = totalPossible - actualHits;
    
    let statusClass, statusLabel, statusIcon;
    if (total === 0) {
      statusClass = "good";
      statusLabel = "No data yet";
      statusIcon = "⚪";
    } else if (actualHits === 0) {
      let expectedHitsCalc = total / expected;
      if (expectedHitsCalc < 0.5) {
        statusClass = "good";
        statusLabel = "✅ Within Expected";
        statusIcon = "✅";
      } else if (expectedHitsCalc < 2) {
        statusClass = "bad";
        statusLabel = "🟠 Under Expected";
        statusIcon = "🟠";
      } else {
        statusClass = "critical";
        statusLabel = "🔴 Very Under Expected";
        statusIcon = "🔴";
      }
    } else if (ratio > 5.0) {
      statusClass = "critical";
      statusLabel = "🔴 Very Under Expected";
      statusIcon = "🔴";
    } else if (ratio > 2.0) {
      statusClass = "bad";
      statusLabel = "🟠 Under Expected";
      statusIcon = "🟠";
    } else if (ratio < 0.5) {
      statusClass = "warning";
      statusLabel = "🟡 Very Above Expected";
      statusIcon = "🟡";
    } else if (ratio < 2.0) {
      statusClass = "warning";
      statusLabel = "🟨 Above Expected";
      statusIcon = "🟨";
    } else {
      statusClass = "good";
      statusLabel = "✅ Within Expected";
      statusIcon = "✅";
    }

    let hitPercentage = total > 0 ? (actualHits/total*100).toFixed(2) : 0;
    let expectedPercentage = (1/expected*100).toFixed(6);

    let label = m >= 10000 ? (m/1000) + 'k' : m + 'x';
    if (m === 100000) label = '100k';
    
    let gaps = getHitGaps(hitRounds);
    let gapDisplay = gaps.min !== null ? `${gaps.min}-${gaps.max}` : 'No data';
    
    let interval = hitIntervals[m];
    let intervalDisplay = '';
    if (interval && interval.hitRounds.length >= 2) {
      intervalDisplay = `Avg: ${interval.avgGap} | Max Dry: ${interval.maxDryStreak || 0}`;
    }

    html += `
      <div class="card">
        <div class="stats-row">
          <b style="font-size:18px;">${label}</b>
          <span style="font-size:20px;">${statusIcon}</span>
        </div>
        
        <div class="stats-row">
          <span>Hits: <b>${actualHits}</b></span>
          <span>Misses: <b>${data[m].misses.toLocaleString()}</b></span>
          <span>Total: <b>${total.toLocaleString()}</b></span>
        </div>
        
        <div class="stats-row small">
          <span>Last hit: ${last || "-"}</span>
          <span>Rounds ago: ${ago}</span>
        </div>
        
        <div class="stats-row small">
          <span>Expected: <b>1/${expected.toLocaleString()}</b> (${expectedPercentage}%)</span>
          <span>Actual: <b>${actualHits}/${total.toLocaleString()}</b> (${hitPercentage}%)</span>
        </div>
        
        <div class="stats-row small">
          <span>Hit gaps: <b>${gapDisplay}</b></span>
          <span>Actual rate: <b>1/${actualRoundsPerHit}</b></span>
        </div>
        
        <div class="stats-row small">
          <span>Total possible: <b>${totalPossible}</b></span>
          <span>Remaining: <b>${remainingHits}</b></span>
        </div>
        
        <div class="stats-row small">
          <span>Interval: <b>${intervalDisplay || 'No data'}</b></span>
        </div>
        
        <div class="stats-row">
          <span class="${statusClass}">
            ${statusLabel}
          </span>
          ${actualHits > 0 ? `<span class="variance-badge">1/${actualRoundsPerHit} rounds</span>` : ''}
        </div>
        
        <div class="stats-row" style="margin-top:6px; padding-top:6px; border-top:1px solid #1f2937;">
          <span style="font-size:14px;">
            Expected hits: <b>${expectedHits.toFixed(2)}</b>
          </span>
          <span class="${aheadBehindClass}" style="font-weight:bold; font-size:14px;">
            ${aheadBehindIcon} ${aheadBehindLabel} by <b>${Math.abs(aheadBehind).toFixed(2)}</b>
          </span>
        </div>
      </div>
    `;
  });

  document.getElementById("dashboard").innerHTML = html;
}

function createButtons(){
  let html = "";
  multipliers.forEach(m=>{
    let label = m >= 10000 ? (m/1000) + 'k' : m + 'x';
    if (m === 100000) label = '100k';
    html += `<button onclick="addEntry(${m})" data-multiplier="${m}">${label}</button>`;
  });
  document.getElementById("buttons").innerHTML = html;
}

document.getElementById("roundInput").addEventListener("keypress", function(e) {
  if (e.key === "Enter") {
    addRoundOnly();
  }
});

load();
updateHitIntervals();
createButtons();
render();
</script>
