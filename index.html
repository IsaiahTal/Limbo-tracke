<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Limbo Analytics Pro</title>

<style>
body {
  font-family: Arial;
  background: #0b1220;
  color: white;
  padding: 14px;
}

h2 { text-align: center; }

input {
  width: 100%;
  padding: 12px;
  margin: 6px 0;
  border-radius: 10px;
  border: none;
  font-size: 16px;
}

button {
  padding: 8px;
  margin: 4px;
  border-radius: 10px;
  border: 2px solid #1f2937;
  color: white;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.3s ease;
  width: 100%;
  font-size: 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 75px;
  position: relative;
  overflow: hidden;
}

button:hover {
  opacity: 0.8;
  transform: scale(1.02);
}

/* Button click animation */
button:active {
  transform: scale(0.92) !important;
  opacity: 0.7 !important;
}

.button-clicked {
  animation: button-flash 0.4s ease;
}

@keyframes button-flash {
  0% { transform: scale(1); }
  30% { transform: scale(0.92); box-shadow: 0 0 20px rgba(255,255,255,0.3); }
  60% { transform: scale(0.96); }
  100% { transform: scale(1); }
}

.button-hit {
  animation: button-hit 0.5s ease;
}

@keyframes button-hit {
  0% { transform: scale(1); }
  20% { transform: scale(0.90); border-color: #22c55e; box-shadow: 0 0 30px rgba(34,197,94,0.4); }
  40% { transform: scale(1.05); }
  60% { transform: scale(0.95); }
  80% { transform: scale(1.02); }
  100% { transform: scale(1); }
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin-top: 10px;
}

/* HEAT MAP COLORS FOR ENTIRE BUTTONS */
.btn-heat-perfect { 
  background: #0a3d1a !important;
  border-color: #22c55e !important;
}

.btn-heat-above-mild { 
  background: #3d3d1a !important;
  border-color: #eab308 !important;
}

.btn-heat-above-severe { 
  background: #4a3d0e !important;
  border-color: #facc15 !important;
}

.btn-heat-under-mild { 
  background: #3d1a1a !important;
  border-color: #ef4444 !important;
}

.btn-heat-under-severe { 
  background: #7f1d1d !important;
  border-color: #dc2626 !important;
}

/* CARDS - No heat map colors, just neutral */
.card {
  background: #111827;
  padding: 10px;
  border-radius: 10px;
  margin-top: 10px;
  border-left: 3px solid #1f2937;
}

.good { color: #22c55e; }
.bad { color: #ef4444; }
.warning { color: #eab308; }
.critical { color: #dc2626; }
.ahead { color: #22c55e; }
.behind { color: #ef4444; }

.small {
  font-size: 12px;
  opacity: 0.8;
}

.stats-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 4px 0;
}

.round-counter {
  font-size: 24px;
  font-weight: bold;
  text-align: center;
  margin: 10px 0;
  padding: 10px;
  background: #111827;
  border-radius: 10px;
  border: 2px solid #1f2937;
}

.variance-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 12px;
  font-weight: bold;
  font-size: 12px;
  background: #1f2937;
}

.ahead-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 12px;
  font-weight: bold;
  font-size: 12px;
  background: #0a3d1a;
  color: #22c55e;
}

.behind-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 12px;
  font-weight: bold;
  font-size: 12px;
  background: #3d1a1a;
  color: #ef4444;
}

.info-box {
  background: #111827;
  padding: 8px 12px;
  border-radius: 8px;
  margin: 5px 0;
  font-size: 13px;
  border-left: 3px solid #3b82f6;
}

.range-badge {
  background: #1e293b;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
}

.input-row {
  display: flex;
  gap: 10px;
  align-items: center;
  margin-bottom: 10px;
}

.input-row input {
  flex: 1;
}

.input-row button {
  flex: 0 0 auto;
  width: auto;
  padding: 12px 20px;
  background: #3b82f6;
  border-color: #3b82f6;
  min-height: auto;
  flex-direction: row;
}

.button-label {
  font-size: 16px;
  font-weight: bold;
}

/* BAR STYLES */
.bar-container {
  display: flex;
  gap: 2px;
  margin-top: 3px;
  width: 100%;
  justify-content: center;
  align-items: center;
}

.bar {
  width: 14px;
  height: 6px;
  border-radius: 2px;
  background: #1f2937;
  transition: all 0.3s ease;
}

.bar-percentage {
  font-size: 9px;
  opacity: 0.8;
  margin-top: 2px;
  font-weight: bold;
}

/* NOT DUE BARS - Red spectrum (cold to hot) */
.bar-notdue-1 { background: #4a1a1a; }  /* 1-10% - Very light red */
.bar-notdue-2 { background: #5a1a1a; }  /* 11-30% - Light red */
.bar-notdue-3 { background: #7a1a1a; }  /* 31-60% - Medium red */
.bar-notdue-4 { background: #9a1a1a; }  /* 61-80% - Red */
.bar-notdue-5 { background: #cc1a1a; }  /* 81-99% - Bright red */

/* DUE BARS - Green to Yellow spectrum */
.bar-due-1 { background: #1a4a1a; }  /* 10-29% - Light green */
.bar-due-2 { background: #1a6a1a; }  /* 30-49% - Green */
.bar-due-3 { background: #2a8a1a; }  /* 50-69% - Bright green */
.bar-due-4 { background: #8a8a1a; }  /* 70-89% - Yellow-green */
.bar-due-5 { background: #ccaa1a; }  /* 90-99% - Bright yellow/gold */

/* EMPTY BARS */
.bar-empty { background: #1f2937; }

/* Percentage text colors */
.pct-notdue { color: #ef4444; }
.pct-due { color: #22c55e; }
.pct-verydue { color: #facc15; }
</style>
</head>

<body>

<h2>🎯 Limbo Analytics Pro</h2>

<div class="input-row">
  <input id="roundInput" type="number" placeholder="Enter Round Number">
  <button onclick="addRoundOnly()">➕ Add Round</button>
</div>

<div class="grid" id="buttons"></div>

<div style="margin-top:10px; display:flex; gap:6px;">
  <button onclick="deleteLast()" style="flex:1; background:#1f2937; min-height:auto; flex-direction:row;">🗑️ Delete Last</button>
  <button onclick="clearAll()" style="flex:1; background:#4a0e0e; min-height:auto; flex-direction:row;">🗑️ Clear All</button>
</div>

<div class="round-counter">
  📊 Current Round: <span id="roundText">0</span>
  <span style="font-size:14px; opacity:0.6; margin-left:10px;">
    (Entries: <span id="entryCount">0</span>)
  </span>
</div>

<div id="dashboard"></div>

<script>
let multipliers = [
200,300,400,500,600,700,800,900,1000,
1500,2000,3000,4000,5000,
10000,20000,30000,40000,50000,100000
];

let entries = [];

const probabilityMap = {
  200: 200,
  300: 300,
  400: 400,
  500: 500,
  600: 600,
  700: 700,
  800: 800,
  900: 900,
  1000: 1000,
  1500: 1500,
  2000: 2000,
  3000: 3000,
  4000: 4000,
  5000: 5000,
  10000: 10000,
  20000: 20000,
  30000: 30000,
  40000: 40000,
  50000: 50000,
  100000: 100000
};

function save(){
  localStorage.setItem("limbo_v4", JSON.stringify(entries));
}

function load(){
  let data = localStorage.getItem("limbo_v4");
  if(data) entries = JSON.parse(data);
}

function addRoundOnly(){
  let r = parseInt(document.getElementById("roundInput").value);
  if(!r) return alert("Enter round number");
  if(r <= 0) return alert("Round must be greater than 0");
  
  if(entries.some(e => e.round === r)) {
    return alert("Round " + r + " already exists! Delete it first or use a different round.");
  }

  entries.push({round:r, multi:null});
  entries.sort((a,b) => a.round - b.round);
  save();
  render();
  document.getElementById("roundInput").value = "";
  document.getElementById("roundInput").focus();
}

function addEntry(hitMulti){
  let r = parseInt(document.getElementById("roundInput").value);
  if(!r) return alert("Enter round number");
  if(r <= 0) return alert("Round must be greater than 0");
  
  if(entries.some(e => e.round === r)) {
    return alert("Round " + r + " already exists! Delete it first or use a different round.");
  }

  entries.push({round:r, multi:hitMulti});
  entries.sort((a,b) => a.round - b.round);
  save();
  render();
  document.getElementById("roundInput").value = "";
  document.getElementById("roundInput").focus();
  
  // Animate the clicked button
  animateButton(hitMulti);
}

function animateButton(multiplier){
  let buttons = document.querySelectorAll('.grid button');
  buttons.forEach(btn => {
    let label = btn.querySelector('.button-label');
    if (label) {
      let btnText = label.textContent;
      let btnMulti = parseInt(btnText.replace('k', '000').replace('x', ''));
      if (btnMulti === multiplier) {
        btn.classList.remove('button-hit');
        void btn.offsetWidth;
        btn.classList.add('button-hit');
      }
    }
  });
}

function deleteLast(){
  if(entries.length === 0) return alert("No entries to delete");
  entries.pop();
  save();
  render();
}

function clearAll(){
  if(entries.length === 0) return;
  if(confirm("Clear all entries?")){
    entries = [];
    save();
    render();
  }
}

function buildStats(){
  let data = {};
  let current = 0;

  multipliers.forEach(m=>{
    data[m] = {
      hits: 0,
      misses: 0,
      totalRounds: 0,
      lastHit: 0,
      hitRounds: []
    };
  });

  if(entries.length === 0) {
    return {data, current: 0};
  }

  current = entries[entries.length - 1].round;

  let entryIndex = 0;
  
  for(let round = 1; round <= current; round++) {
    let hitMulti = null;
    if(entryIndex < entries.length && entries[entryIndex].round === round) {
      hitMulti = entries[entryIndex].multi;
      entryIndex++;
    }

    multipliers.forEach(m => {
      data[m].totalRounds++;
      
      if(hitMulti !== null && hitMulti >= m) {
        data[m].hits++;
        data[m].lastHit = round;
        data[m].hitRounds.push(round);
      } else {
        data[m].misses++;
      }
    });
  }

  return {data, current};
}

function getHitGaps(hitRounds) {
  if (hitRounds.length < 2) return { min: null, max: null, avg: null };
  
  let gaps = [];
  for (let i = 1; i < hitRounds.length; i++) {
    gaps.push(hitRounds[i] - hitRounds[i-1]);
  }
  
  return {
    min: Math.min(...gaps),
    max: Math.max(...gaps),
    avg: Math.round(gaps.reduce((a,b) => a + b, 0) / gaps.length)
  };
}

function getHeatMapType(totalRounds, actualHits, multiplier) {
  if (totalRounds === 0) return "perfect";
  
  if (actualHits === 0) {
    let expectedHits = totalRounds / multiplier;
    if (expectedHits < 0.5) return "perfect";
    if (expectedHits < 2) return "under-mild";
    return "under-severe";
  }
  
  let actualRoundsPerHit = totalRounds / actualHits;
  let expectedRoundsPerHit = multiplier;
  let ratio = actualRoundsPerHit / expectedRoundsPerHit;
  
  if (ratio > 5.0) return "under-severe";
  if (ratio > 2.0) return "under-mild";
  if (ratio < 0.5) return "above-severe";
  if (ratio < 2.0) return "above-mild";
  return "perfect";
}

function getButtonClass(heatType) {
  switch(heatType) {
    case 'perfect': return 'btn-heat-perfect';
    case 'above-mild': return 'btn-heat-above-mild';
    case 'above-severe': return 'btn-heat-above-severe';
    case 'under-mild': return 'btn-heat-under-mild';
    case 'under-severe': return 'btn-heat-under-severe';
    default: return '';
  }
}

function getBars(roundsSinceLastHit, minGap, maxGap, multiplier) {
  if (minGap === null) {
    let expectedGap = multiplier;
    let ratio = roundsSinceLastHit / expectedGap;
    
    if (ratio >= 1) {
      let duePercent = Math.min(99, Math.round((ratio) * 100));
      let bars = Math.min(5, Math.floor(duePercent / 20) + 1);
      let barClass = 'bar-due-';
      let pctClass = 'pct-due';
      let status = 'Due';
      return { bars, barClass, pctClass, percentage: duePercent, status };
    } else {
      let notDuePercent = Math.min(99, Math.round((1 - ratio) * 100));
      let bars = Math.min(5, Math.floor(notDuePercent / 20) + 1);
      let barClass = 'bar-notdue-';
      let pctClass = 'pct-notdue';
      let status = 'Not Due';
      return { bars, barClass, pctClass, percentage: notDuePercent, status };
    }
  }
  
  if (roundsSinceLastHit >= minGap) {
    let duePercent = Math.min(99, Math.round(((roundsSinceLastHit - minGap) / minGap) * 100 + 10));
    let bars = Math.min(5, Math.floor(duePercent / 20) + 1);
    let barClass = 'bar-due-';
    let pctClass = duePercent >= 70 ? 'pct-verydue' : 'pct-due';
    let status = duePercent >= 70 ? 'Very Due' : 'Due';
    return { bars, barClass, pctClass, percentage: duePercent, status };
  } else {
    let notDuePercent = Math.min(99, Math.round(((minGap - roundsSinceLastHit) / minGap) * 100));
    let bars = Math.min(5, Math.floor(notDuePercent / 20) + 1);
    let barClass = 'bar-notdue-';
    let pctClass = 'pct-notdue';
    let status = 'Not Due';
    return { bars, barClass, pctClass, percentage: notDuePercent, status };
  }
}

function render(){

  let {data, current} = buildStats();

  document.getElementById("roundText").innerText = current;
  document.getElementById("entryCount").innerText = entries.length;

  let buttonHtml = "";
  multipliers.forEach(m=>{
    let total = data[m].totalRounds;
    let actualHits = data[m].hits;
    let lastHit = data[m].lastHit;
    let hitRounds = data[m].hitRounds;
    let heatType = getHeatMapType(total, actualHits, m);
    let btnClass = getButtonClass(heatType);
    
    let label = m >= 10000 ? (m/1000) + 'k' : m + 'x';
    if (m === 100000) label = '100k';
    
    let gaps = getHitGaps(hitRounds);
    let minGap = gaps.min;
    let maxGap = gaps.max;
    
    let roundsSinceLastHit = lastHit ? current - lastHit : current;
    
    let barResult = getBars(roundsSinceLastHit, minGap, maxGap, m);
    let bars = barResult.bars;
    let barClass = barResult.barClass;
    let percentage = barResult.percentage;
    let pctClass = barResult.pctClass;
    let status = barResult.status;
    
    let barHtml = '';
    for (let i = 0; i < 5; i++) {
      let filled = i < bars ? barClass + (i + 1) : 'bar-empty';
      barHtml += `<div class="bar ${filled}"></div>`;
    }
    
    buttonHtml += `
      <button class="${btnClass}" onclick="addEntry(${m})" data-multiplier="${m}">
        <span class="button-label">${label}</span>
        <div class="bar-container">
          ${barHtml}
        </div>
        <span class="bar-percentage ${pctClass}">${percentage}% ${status}</span>
      </button>
    `;
  });
  document.getElementById("buttons").innerHTML = buttonHtml;

  let html = "";

  if(entries.length > 0) {
    html += `
      <div class="info-box">
        📊 Total Rounds: <b>${current.toLocaleString()}</b> | 
        Entries: <b>${entries.length}</b> | 
        Range: <b>1 - ${current.toLocaleString()}</b>
        ${current > 0 ? `<span class="range-badge">All rounds automatically counted</span>` : ''}
      </div>
    `;
  }

  multipliers.forEach(m=>{
    let last = data[m].lastHit;
    let ago = last ? current - last : "-";

    let expected = probabilityMap[m];
    let total = data[m].totalRounds;
    let actualHits = data[m].hits;
    let hitRounds = data[m].hitRounds;
    
    let expectedHits = total / expected;
    let variance = total > 0 ? actualHits - expectedHits : "-";
    let varianceDisplay = variance !== "-" ? variance.toFixed(4) : "-";
    
    let actualRoundsPerHit = actualHits > 0 ? (total / actualHits).toFixed(0) : "∞";
    let ratio = actualHits > 0 ? (total / actualHits) / expected : Infinity;
    
    let aheadBehind = actualHits - expectedHits;
    let aheadBehindDisplay = aheadBehind.toFixed(2);
    let aheadBehindClass = aheadBehind >= 0 ? "ahead" : "behind";
    let aheadBehindLabel = aheadBehind >= 0 ? "Ahead" : "Behind";
    let aheadBehindIcon = aheadBehind >= 0 ? "✅" : "🔴";
    
    let statusClass, statusLabel, statusIcon;
    if (total === 0) {
      statusClass = "good";
      statusLabel = "No data yet";
      statusIcon = "⚪";
    } else if (actualHits === 0) {
      let expectedHitsCalc = total / expected;
      if (expectedHitsCalc < 0.5) {
        statusClass = "good";
        statusLabel = "✅ Within Expected";
        statusIcon = "✅";
      } else if (expectedHitsCalc < 2) {
        statusClass = "bad";
        statusLabel = "🟠 Under Expected";
        statusIcon = "🟠";
      } else {
        statusClass = "critical";
        statusLabel = "🔴 Very Under Expected";
        statusIcon = "🔴";
      }
    } else if (ratio > 5.0) {
      statusClass = "critical";
      statusLabel = "🔴 Very Under Expected";
      statusIcon = "🔴";
    } else if (ratio > 2.0) {
      statusClass = "bad";
      statusLabel = "🟠 Under Expected";
      statusIcon = "🟠";
    } else if (ratio < 0.5) {
      statusClass = "warning";
      statusLabel = "🟡 Very Above Expected";
      statusIcon = "🟡";
    } else if (ratio < 2.0) {
      statusClass = "warning";
      statusLabel = "🟨 Above Expected";
      statusIcon = "🟨";
    } else {
      statusClass = "good";
      statusLabel = "✅ Within Expected";
      statusIcon = "✅";
    }

    let hitPercentage = total > 0 ? (actualHits/total*100).toFixed(2) : 0;
    let expectedPercentage = (1/expected*100).toFixed(6);

    let label = m >= 10000 ? (m/1000) + 'k' : m + 'x';
    if (m === 100000) label = '100k';
    
    let gaps = getHitGaps(hitRounds);
    let gapDisplay = gaps.min !== null ? `${gaps.min}-${gaps.max}` : 'No data';

    html += `
      <div class="card">
        <div class="stats-row">
          <b style="font-size:18px;">${label}</b>
          <span style="font-size:20px;">${statusIcon}</span>
        </div>
        
        <div class="stats-row">
          <span>Hits: <b>${actualHits}</b></span>
          <span>Misses: <b>${data[m].misses.toLocaleString()}</b></span>
          <span>Total: <b>${total.toLocaleString()}</b></span>
        </div>
        
        <div class="stats-row small">
          <span>Last hit: ${last || "-"}</span>
          <span>Rounds ago: ${ago}</span>
        </div>
        
        <div class="stats-row small">
          <span>Expected: <b>1/${expected.toLocaleString()}</b> (${expectedPercentage}%)</span>
          <span>Actual: <b>${actualHits}/${total.toLocaleString()}</b> (${hitPercentage}%)</span>
        </div>
        
        <div class="stats-row small">
          <span>Hit gaps: <b>${gapDisplay}</b></span>
          <span>Actual rate: <b>1/${actualRoundsPerHit}</b></span>
        </div>
        
        <div class="stats-row">
          <span class="${statusClass}">
            ${statusLabel}
          </span>
          ${actualHits > 0 ? `<span class="variance-badge">1/${actualRoundsPerHit} rounds</span>` : ''}
        </div>
        
        <div class="stats-row" style="margin-top:6px; padding-top:6px; border-top:1px solid #1f2937;">
          <span style="font-size:14px;">
            Expected hits: <b>${expectedHits.toFixed(2)}</b>
          </span>
          <span class="${aheadBehindClass}" style="font-weight:bold; font-size:14px;">
            ${aheadBehindIcon} ${aheadBehindLabel} by <b>${Math.abs(aheadBehind).toFixed(2)}</b>
          </span>
        </div>
      </div>
    `;
  });

  document.getElementById("dashboard").innerHTML = html;
}

function createButtons(){
  let html = "";
  multipliers.forEach(m=>{
    let label = m >= 10000 ? (m/1000) + 'k' : m + 'x';
    if (m === 100000) label = '100k';
    html += `<button onclick="addEntry(${m})" data-multiplier="${m}">${label}</button>`;
  });
  document.getElementById("buttons").innerHTML = html;
}

document.getElementById("roundInput").addEventListener("keypress", function(e) {
  if (e.key === "Enter") {
    addRoundOnly();
  }
});

load();
createButtons();
render();
</script>

</body>
</html>
