<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Limbo Analytics Pro</title>

<style>
body {
  font-family: Arial;
  background: #0b1220;
  color: white;
  padding: 14px;
}

h2 { text-align: center; }

input {
  width: 100%;
  padding: 12px;
  margin: 6px 0;
  border-radius: 10px;
  border: none;
}

button {
  padding: 10px;
  margin: 4px;
  border-radius: 10px;
  border: none;
  background: #1f2937;
  color: white;
  font-weight: bold;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin-top: 10px;
}

.card {
  background: #111827;
  padding: 10px;
  border-radius: 10px;
  margin-top: 10px;
}

.good { color: #22c55e; }
.bad { color: #ef4444; }

.small {
  font-size: 12px;
  opacity: 0.8;
}
</style>
</head>

<body>

<h2>🎯 Limbo Analytics Pro</h2>

<input id="roundInput" type="number" placeholder="Enter Round Number">

<div class="grid" id="buttons"></div>

<button onclick="deleteLast()">🗑️ Delete Last</button>

<h3 id="roundText">Round: 0</h3>

<div id="dashboard"></div>

<script>
let multipliers = [
200,300,400,500,600,700,800,900,1000,
1500,2000,3000,4000,5000
];

let entries = [];

const probabilityMap = {
  200: 200,
  300: 300,
  400: 400,
  500: 500,
  600: 600,
  700: 700,
  800: 800,
  900: 900,
  1000: 1000,
  1500: 1500,
  2000: 2000,
  3000: 3000,
  4000: 4000,
  5000: 5000
};

function save(){
  localStorage.setItem("limbo_v3", JSON.stringify(entries));
}

function load(){
  let data = localStorage.getItem("limbo_v3");
  if(data) entries = JSON.parse(data);
}

function addEntry(m){
  let r = parseInt(document.getElementById("roundInput").value);
  if(!r) return alert("Enter round number");

  entries.push({round:r, multi:m});
  save();
  render();
}

function deleteLast(){
  entries.pop();
  save();
  render();
}

function buildStats(){
  let data = {};
  let current = 0;

  multipliers.forEach(m=>{
    data[m] = {hits:0,last:0};
  });

  entries.forEach(e=>{
    current = e.round;

    multipliers.forEach(m=>{
      if(e.multi >= m){
        data[m].hits++;
        data[m].last = e.round;
      }
    });
  });

  return {data,current};
}

function render(){

  let {data, current} = buildStats();

  document.getElementById("roundText").innerText = "Round: " + current;

  let html = "";

  multipliers.forEach(m=>{
    let last = data[m].last;
    let ago = last ? current - last : "-";

    let expected = probabilityMap[m];
    let actualRate = data[m].hits ? (current / data[m].hits).toFixed(0) : "-";

    let status = data[m].hits && actualRate > expected ? "bad" : "good";

    html += `
      <div class="card">
        <b>${m}x</b><br><br>

        Hits: ${data[m].hits}<br>
        Last hit: ${last || "-"}<br>
        Rounds ago: ${ago}<br><br>

        <span class="small">
          Expected: 1 / ${expected}<br>
          Actual: ~1 / ${actualRate}
        </span><br><br>

        <span class="${status}">
          ${status === "good" ? "Within expected range" : "Above expected variance"}
        </span>
      </div>
    `;
  });

  document.getElementById("dashboard").innerHTML = html;
}

function createButtons(){
  let html = "";
  multipliers.forEach(m=>{
    html += `<button onclick="addEntry(${m})">${m}x</button>`;
  });
  document.getElementById("buttons").innerHTML = html;
}

load();
createButtons();
render();
</script>

</body>
</html>
