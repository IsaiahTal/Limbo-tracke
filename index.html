<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Limbo Tracker</title>

<style>
body {
  font-family: Arial;
  background: #0f172a;
  color: white;
  padding: 15px;
}

h2 { text-align: center; }

input {
  width: 100%;
  padding: 12px;
  margin: 5px 0;
  border-radius: 8px;
  border: none;
}

button {
  padding: 12px;
  margin: 5px;
  border-radius: 10px;
  border: none;
  background: #1e293b;
  color: white;
  font-weight: bold;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin-top: 10px;
}

.card {
  background: #1e293b;
  padding: 10px;
  border-radius: 10px;
  margin-top: 8px;
}

.highlight {
  color: #22c55e;
  font-weight: bold;
}

.small {
  font-size: 12px;
  opacity: 0.8;
}
</style>
</head>

<body>

<h2>🎯 Limbo Tracker</h2>

<input id="roundInput" type="number" placeholder="Enter Round Number">

<div class="grid" id="buttons"></div>

<button onclick="deleteLast()">🗑️ Delete Last Entry</button>

<h3 id="roundText">Round: 0</h3>

<div id="stats"></div>

<script>
let multipliers = [
100,200,300,400,500,600,700,800,900,1000,
1500,2000,3000,4000,5000
];

let entries = [];

function save(){
  localStorage.setItem("limbo_entries", JSON.stringify(entries));
}

function load(){
  let saved = localStorage.getItem("limbo_entries");
  if(saved){
    entries = JSON.parse(saved);
  }
}

function addEntry(m){
  let r = parseInt(document.getElementById("roundInput").value);
  if(!r) return alert("Enter round number");

  entries.push({round:r, multi:m});
  save();
  render();
}

function deleteLast(){
  if(entries.length === 0) return;
  entries.pop();
  save();
  render();
}

function render(){

  let data = {};
  let currentRound = 0;

  multipliers.forEach(m=>{
    data[m] = {hits:0,last:0};
  });

  entries.forEach(e=>{
    currentRound = e.round;

    multipliers.forEach(m=>{
      if(e.multi >= m){
        data[m].hits++;
        data[m].last = e.round;
      }
    });
  });

  document.getElementById("roundText").innerText = "Round: " + currentRound;

  let html = "";

  multipliers.forEach(m=>{
    let last = data[m].last;
    let ago = last ? currentRound - last : "-";

    html += `
      <div class="card">
        <b>${m}x</b><br>
        Hits: ${data[m].hits}<br>
        Last: ${last || "-"}<br>
        <span class="highlight">Ago: ${ago}</span>
      </div>
    `;
  });

  document.getElementById("stats").innerHTML = html;
}

function createButtons(){
  let html = "";
  multipliers.forEach(m=>{
    html += `<button onclick="addEntry(${m})">${m}x</button>`;
  });
  document.getElementById("buttons").innerHTML = html;
}

load();
createButtons();
render();
</script>

</body>
</html>
