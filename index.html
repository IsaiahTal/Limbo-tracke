<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Limbo Analytics Pro</title>

<style>
body {
  font-family: Arial;
  background: #0b1220;
  color: white;
  padding: 14px;
}

h2 { text-align: center; }

input {
  width: 100%;
  padding: 12px;
  margin: 6px 0;
  border-radius: 10px;
  border: none;
}

/* GRID (6–3 layout on mobile) */
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 10px;
}

/* BUTTON CELL */
.cell {
  background: #111827;
  border-radius: 10px;
  padding: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* BUTTON */
button {
  padding: 8px;
  border-radius: 8px;
  border: none;
  background: #1f2937;
  color: white;
  font-weight: bold;
  width: 70%;
}

/* HEAT BOX */
.heat {
  width: 12px;
  height: 12px;
  border-radius: 3px;
}

.green { background: #22c55e; }
.yellow { background: #facc15; }
.red { background: #ef4444; }

.card {
  background: #111827;
  padding: 10px;
  border-radius: 10px;
  margin-top: 10px;
  font-size: 13px;
}

#status {
  font-size: 12px;
  opacity: 0.8;
  margin-top: 6px;
}
</style>
</head>

<body>

<h2>🎯 Limbo Analytics Pro</h2>

<input id="roundInput" type="number" placeholder="Enter Round Number">

<div class="grid" id="buttons"></div>

<button onclick="deleteLast()">🗑️ Delete Last</button>
<button onclick="manualSave()">💾 Save Progress</button>
<button onclick="resetAll()">🧨 Reset</button>

<div id="status"></div>

<h3 id="roundText">Round: 0</h3>

<div id="dashboard"></div>

<script>

let multipliers = [
200,300,400,500,600,700,
800,900,1000,1500,2000,
3000,4000,5000
];

let entries = [];

const probabilityMap = {
200:200,300:300,400:400,500:500,600:600,700:700,
800:800,900:900,1000:1000,1500:1500,2000:2000,
3000:3000,4000:4000,5000:5000
};

function save(){
  localStorage.setItem("limbo_v11", JSON.stringify(entries));
}

function load(){
  let data = localStorage.getItem("limbo_v11");
  if(data) entries = JSON.parse(data);
}

function manualSave(){
  save();
  showStatus("✔ Saved");
}

function showStatus(msg){
  document.getElementById("status").innerText = msg;
  setTimeout(()=>document.getElementById("status").innerText="",2000);
}

function addEntry(hitMulti){
  let r = parseInt(document.getElementById("roundInput").value);
  if(!r) return alert("Enter round number");

  entries.push({round:r, multi:hitMulti});
  save();
  render();
}

function deleteLast(){
  entries.pop();
  save();
  render();
}

function resetAll(){
  if(!confirm("Reset ALL data?")) return;
  entries = [];
  localStorage.removeItem("limbo_v11");
  render();
  showStatus("🧨 Reset done");
}

function buildStats(){
  let data = {};
  let current = 0;

  multipliers.forEach(m=>{
    data[m] = {hits:0,misses:0,last:0};
  });

  entries.forEach(e=>{
    current = e.round;

    multipliers.forEach(m=>{
      if(e.multi >= m){
        data[m].hits++;
        data[m].last = e.round;
      } else {
        data[m].misses++;
      }
    });
  });

  return {data,current};
}

/* ✅ FIXED HEAT LOGIC (CORRECT VERSION) */
function getHeat(hits, expected, current){

  let expectedHits = current / expected;

  if(expectedHits === 0) return "green";

  let ratio = hits / expectedHits;

  // 🟩 normal range
  if(ratio >= 0.8 && ratio <= 1.2){
    return "green";
  }

  // 🟨 over-performing
  if(ratio > 1.2){
    return "yellow";
  }

  // 🟥 under-performing
  return "red";
}

function render(){

  let {data, current} = buildStats();

  document.getElementById("roundText").innerText = "Round: " + current;

  /* BUTTON GRID */
  let btnHTML = "";

  multipliers.forEach(m=>{
    let color = getHeat(data[m].hits, probabilityMap[m], current);

    btnHTML += `
      <div class="cell">
        <button onclick="addEntry(${m})">${m}x</button>
        <div class="heat ${color}"></div>
      </div>
    `;
  });

  document.getElementById("buttons").innerHTML = btnHTML;

  /* STATS */
  let statsHTML = "";

  multipliers.forEach(m=>{
    let expected = probabilityMap[m];
    let total = data[m].hits + data[m].misses;

    statsHTML += `
      <div class="card">
        <b>${m}x</b><br>
        Hits: ${data[m].hits}<br>
        Misses: ${data[m].misses}<br>
        Expected: 1/${expected}
      </div>
    `;
  });

  document.getElementById("dashboard").innerHTML = statsHTML;
}

load();
render();

</script>

</body>
</html>
